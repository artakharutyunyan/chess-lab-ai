<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      var stored = null;
      try {
        stored = localStorage.getItem("theme");
      } catch (e) {
        // Storage unavailable (private browsing, blocked by policy) --
        // fall back to light rather than leaving data-theme unset.
      }
      document.documentElement.setAttribute(
        "data-theme",
        stored === "dark" ? "dark" : "light"
      );
    })();
  </script>
  <!-- Versioned query string: browsers cache favicons per-origin far more
       aggressively than normal assets and often won't re-fetch one even
       across reloads once cached for this origin+path -- bumping this
       forces it to be treated as a new URL. Bump again (v3, v4, ...) if
       the favicon image itself changes and still doesn't show up. -->
  <link rel="icon" href="/favicon.ico?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1d2018" />
  <meta name="description" content="Chess Lab Ai -- play chess against a configurable engine, browse World Chess Champions, and customize your board." />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="manifest" href="/manifest.json" />
  <title>Chess Lab Ai</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
